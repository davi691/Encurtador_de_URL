<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linka — encurtador com domínio próprio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-grid" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="7" cy="15" r="4.2" stroke="currentColor" stroke-width="2"/>
          <circle cx="15" cy="7" r="4.2" stroke="currentColor" stroke-width="2"/>
          <line x1="9.5" y1="12.5" x2="12.5" y2="9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name">linka<span class="brand-dot">.</span></span>
    </div>
    <div class="domain-config" id="domainConfig">
      <span class="domain-label">seu domínio</span>
      <input type="text" id="customDomain" class="domain-input" placeholder="lnk.suamarca.com" spellcheck="false" />
    </div>
  </header>

  <main class="stage">
    <section class="hero">
      <p class="eyebrow">encurtador de url</p>
      <h1 class="headline">Um link comprido<br>vira um <em>elo curto</em>.</h1>
      <p class="sub">Cole o endereço, escolha um apelido (ou deixe a gente sortear) e receba um link no seu próprio domínio.</p>
    </section>

    <section class="compressor" aria-label="Formulário de encurtamento">
      <form id="shortenForm" class="compressor-form">
        <div class="field field-long">
          <label for="longUrl">link original</label>
          <input
            type="url"
            id="longUrl"
            name="longUrl"
            placeholder="https://exemplo.com/um/caminho/bem/longo/para/encurtar"
            required
            autocomplete="off"
          />
        </div>

        <div class="link-visual" id="linkVisual" aria-hidden="true">
          <span class="node node-a"></span>
          <span class="link-line">
            <span class="link-pulse"></span>
          </span>
          <span class="node node-b"></span>
        </div>

        <div class="field field-slug">
          <label for="customSlug">apelido <span class="optional">(opcional)</span></label>
          <div class="slug-wrap">
            <span class="slug-prefix" id="slugPrefix">lnk.suamarca.com/</span>
            <input
              type="text"
              id="customSlug"
              name="customSlug"
              placeholder="promo-verao"
              autocomplete="off"
              maxlength="30"
            />
          </div>
        </div>

        <button type="submit" class="btn-shorten">
          <span>Encurtar link</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h9M8 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <p class="form-error" id="formError" role="alert"></p>
      </form>
    </section>

    <section class="result" id="resultCard" hidden>
      <div class="result-stamp">
        <span class="stamp-label">pronto</span>
        <code class="stamp-code" id="resultShort"></code>
        <button class="btn-copy" id="btnCopy" type="button">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="4.5" y="4.5" width="8" height="8" rx="1.4" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 9.5v-6A1 1 0 0 1 3.5 2.5h6" stroke="currentColor" stroke-width="1.3"/></svg>
          <span>copiar</span>
        </button>
      </div>
      <p class="result-original" id="resultOriginal"></p>
    </section>

    <section class="manifest" aria-label="Histórico de links">
      <div class="manifest-head">
        <h2>seus links</h2>
        <button class="btn-clear" id="btnClear" type="button">limpar tudo</button>
      </div>
      <div class="manifest-empty" id="manifestEmpty">
        <p>Nenhum link encurtado ainda. O primeiro fica aqui embaixo.</p>
      </div>
      <ul class="manifest-list" id="manifestList"></ul>
    </section>

    <section class="setup-note">
    </section>
  </main>

  <footer class="page-footer">
  </footer>

  <script src="script.js"></script>
</body>
</html>
